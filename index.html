<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tread — Trainer Tracker</title>
<meta name="theme-color" content="#e6e7e2">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root{
    --bg1:#eef0ea; --bg2:#dbddd6; --ink:#191c1a; --muted:#6d726b;
    --line:#cbcfc7; --surface:#f7f8f4; --volt:#c9f21e; --volt-ink:#141804;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:radial-gradient(130% 90% at 50% -5%, var(--bg1) 40%, var(--bg2) 100%) fixed;
    min-height:100dvh;
    padding:calc(14px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:460px; margin:0 auto}
  button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; touch-action:manipulation}
  :focus-visible{outline:2px solid var(--ink); outline-offset:2px; border-radius:6px}

  /* header */
  .eyebrow{font-size:11px; font-weight:700; letter-spacing:.24em; color:var(--muted); text-transform:uppercase}
  h1{font-size:26px; font-weight:900; font-style:italic; letter-spacing:-.02em; margin-top:3px}
  .sub{font-size:13px; color:var(--muted); margin-top:1px}
  .top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px}
  #motionBtn{
    flex:none; margin-top:4px; font-size:12px; font-weight:700; padding:8px 12px;
    border:1.5px solid var(--ink); border-radius:999px; background:var(--surface);
  }

  /* stage */
  #stage{position:relative; margin:4px 0 0; touch-action:pan-y; -webkit-user-select:none; user-select:none}
  #stage svg{display:block; margin:0 auto; width:auto; height:clamp(320px,46vh,540px); height:clamp(320px,46dvh,540px)}
  .hint{position:absolute; bottom:2px; right:14px; font-size:10.5px; color:var(--muted); letter-spacing:.06em; opacity:.8; pointer-events:none}

  /* readout */
  .readout{margin-top:-6px}
  .bigrow{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
  .big{font-size:clamp(58px,19vw,86px); font-weight:900; font-style:italic; letter-spacing:-.045em; line-height:.95}
  .big small{font-size:.45em; letter-spacing:-.02em}
  .chip{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700;
        padding:7px 12px; border-radius:999px; background:var(--surface); border:1px solid var(--line);
        transform:translateY(-8px)}
  .chip i{width:9px; height:9px; border-radius:50%; background:var(--volt); flex:none}
  .stats{margin-top:6px; font-size:14.5px; color:var(--muted)}
  .stats b{color:var(--ink); font-weight:800}

  .stats2{margin-top:3px; font-size:13.5px}
  .toast{
    position:absolute; top:8px; left:50%; transform:translateX(-50%) translateY(-8px);
    max-width:90%; text-align:center; background:var(--volt); color:var(--volt-ink);
    font-weight:800; font-style:italic; font-size:14px; padding:10px 16px; border-radius:999px;
    box-shadow:0 8px 20px rgba(20,24,18,.2); opacity:0; transition:opacity .35s, transform .35s;
    pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  /* add */
  .addrow{display:flex; gap:10px; margin-top:18px}
  .addrow input{
    flex:1; min-width:0; font-size:17px; font-weight:700; padding:14px 16px;
    background:var(--surface); border:1.5px solid var(--line); border-radius:16px; color:var(--ink);
  }
  .addrow input::placeholder{color:#a2a79f; font-weight:600}
  .addrow input:focus{border-color:var(--ink); outline:none}
  .addrow input.bad{border-color:#d5361f}
  #addBtn{
    flex:none; background:var(--volt); color:var(--volt-ink); font-weight:900; font-style:italic;
    letter-spacing:.01em; font-size:16px; padding:14px 18px; border-radius:16px;
    box-shadow:0 2px 0 #9dbf0f;
  }
  #addBtn:active{transform:translateY(1px); box-shadow:0 1px 0 #9dbf0f}
  .chips{display:flex; gap:8px; margin-top:10px}
  .chips button{
    font-size:13.5px; font-weight:700; padding:8px 14px; border-radius:999px;
    border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
  }
  .chips button:active{background:var(--line)}

  /* chart */
  .chart{margin-top:26px}
  .chartHead{display:flex; justify-content:space-between; align-items:center}
  .metricBtn{font-size:12.5px; font-weight:700; padding:7px 12px; border-radius:999px;
             background:var(--surface); border:1px solid var(--line)}
  #chart{display:block; width:100%; height:auto; margin-top:8px; cursor:pointer; touch-action:manipulation}
  #chart .cLine{fill:none; stroke:var(--ink); stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
  #chart .cDot{fill:var(--volt); stroke:var(--ink); stroke-width:1.5}
  #chart .cGrid{stroke:#cdd1c9; stroke-width:1}
  #chart .cLbl{font-size:10.5px; fill:#8f948c}
  #chart .cEmpty{font-size:12.5px; fill:#8f948c}

  /* log */
  .hist{margin-top:26px}
  .histHead{display:flex; justify-content:space-between; align-items:center}
  #log{list-style:none; margin-top:4px; max-height:250px; overflow-y:auto;
       overscroll-behavior:contain; -webkit-overflow-scrolling:touch}
  #log::-webkit-scrollbar{width:6px}
  #log::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px}
  #log li{display:flex; align-items:center; gap:12px; padding:9px 2px; border-bottom:1px solid var(--line); font-size:14.5px}
  #log .d{color:var(--muted); flex:1; text-align:left; text-decoration:underline dotted; text-decoration-color:#b8bdb4; text-underline-offset:3px}
  #log .t{color:var(--muted); font-variant-numeric:tabular-nums; min-width:58px;
          display:flex; flex-direction:column; align-items:flex-end; gap:1px}
  #log .t .tv{text-decoration:underline dotted; text-decoration-color:#b8bdb4; text-underline-offset:3px}
  #log .t .p{font-size:11px; color:#90958d}
  #log .m{font-weight:800; font-style:italic; min-width:60px; text-align:right}
  #log .del{color:var(--muted); font-size:17px; padding:4px 8px; line-height:1; border-radius:8px}
  #log .del:active{color:var(--ink); background:var(--line)}
  .empty{padding:14px 2px; color:var(--muted); font-size:14px}

  /* footer */
  footer{display:flex; align-items:center; gap:6px; margin-top:22px; font-size:13px; color:var(--muted)}
  .linky{font-size:13px; font-weight:700; color:var(--ink); text-decoration:underline; text-underline-offset:3px; padding:4px 2px}
  .build{margin-left:auto; font-size:11px; letter-spacing:.14em}

  /* dialog */
  dialog{
    border:0; border-radius:20px; padding:22px; width:min(88vw,340px);
    background:var(--surface); color:var(--ink); box-shadow:0 18px 50px rgba(20,24,18,.25);
  }
  dialog::backdrop{background:rgba(25,28,26,.35)}
  dialog h2{font-size:18px; font-weight:900; font-style:italic}
  dialog p{font-size:14px; color:var(--muted); margin-top:6px}
  dialog input{
    width:100%; margin-top:14px; font-size:17px; font-weight:700; padding:12px 14px;
    border:1.5px solid var(--line); border-radius:14px; background:#fff;
  }
  .dlgrow{display:flex; gap:10px; margin-top:16px}
  .dlgrow button{flex:1; font-weight:800; padding:12px; border-radius:14px; border:1.5px solid var(--line)}
  .dlgrow .ok{background:var(--ink); color:#fff; border-color:var(--ink)}
  .dlgrow .ok.danger{background:#d5361f; border-color:#d5361f}
</style>
</head>

<script>
(function(){
'use strict';
var $ = function(id){ return document.getElementById(id); };

/* ---------- storage ---------- */
function load(){ try{ return JSON.parse(localStorage.getItem('tread')||'null'); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem('tread', JSON.stringify(data)); }catch(e){} }
var data = load() || { target:400, entries:[] };
if(!(data.target>0)) data.target = 400;
if(!Array.isArray(data.entries)) data.entries = [];
if(data.metric!=='pace' && data.metric!=='time') data.metric = 'dist';
if(typeof data.ejKey!=='string') data.ejKey = '';
if(typeof data.ejService!=='string') data.ejService = '';
if(typeof data.ejTemplate!=='string') data.ejTemplate = '';
if(!(data.recapLast>0)) data.recapLast = 0;

var total = function(){ return data.entries.reduce(function(a,e){ return a+e.m; },0); };

/* ---------- time helpers ---------- */
function p2(n){ return (n<10?'0':'')+n; }
function fmtTime(t){
  var h=Math.floor(t/3600), m=Math.floor(t%3600/60), sec=t%60;
  return h ? h+':'+p2(m)+':'+p2(sec) : m+':'+p2(sec);
}
function parseTime(v){
  v = (''+v).trim().replace(/[.\s:]+/g, ':').replace(/^:+|:+$/g, '');
  if(!v) return null;
  if(v.indexOf(':')>-1){
    var p = v.split(':');
    if(p.length>3 || p.some(function(x){ return !/^\d+$/.test(x); })) return null;
    var n = p.map(Number), sec;
    if(p.length===3){ if(n[1]>59||n[2]>59) return null; sec = n[0]*3600+n[1]*60+n[2]; }
    else { if(n[1]>59) return null; sec = n[0]*60+n[1]; }
    return (sec>0 && sec<86400) ? sec : null;
  }
  if(!/^\d+$/.test(v)) return null;
  if(v.length<=2) return +v>0 ? +v*60 : null;
  if(v.length<=4){ var ss=+v.slice(-2); if(ss>59) return null; return +v.slice(0,-2)*60+ss; }
  return null;
}

/* ---------- wear colour ---------- */
function hexLerp(a,b,t){
  var pa=[1,3,5].map(function(i){return parseInt(a.substr(i,2),16);});
  var pb=[1,3,5].map(function(i){return parseInt(b.substr(i,2),16);});
  return '#'+pa.map(function(v,i){ return Math.round(v+(pb[i]-v)*t).toString(16).padStart(2,'0'); }).join('');
}
var VOLT=['#dcff55','#9fce14'], AMBER=['#ffcf4d','#e0951c'], RED=['#ff7a5c','#d5361f'];
function liqColors(p){
  if(p<=0.55) return VOLT;
  if(p<0.8){ var t=(p-0.55)/0.25; return [hexLerp(VOLT[0],AMBER[0],t), hexLerp(VOLT[1],AMBER[1],t)]; }
  if(p<1){ var u=(p-0.8)/0.2; return [hexLerp(AMBER[0],RED[0],u), hexLerp(AMBER[1],RED[1],u)]; }
  return RED;
}
function statusLabel(p){
  if(p<0.15) return 'Box fresh';
  if(p<0.45) return 'Nicely broken in';
  if(p<0.7)  return 'Solid miles on these';
  if(p<0.9)  return 'Watch the midsole';
  if(p<1)    return 'Nearly cooked';
  return 'Time for a new pair';
}
var fmtDate = new Intl.DateTimeFormat('en-GB',{weekday:'short', day:'numeric', month:'short'});
var fmtDay = new Intl.DateTimeFormat('en-GB',{day:'numeric', month:'short'});

/* ---------- trend chart ---------- */
var METRICS = ['dist','pace','time'];
var METRIC_LABEL = { dist:'Distance mi', pace:'Pace /mi \u00b7 faster \u2191', time:'Time' };
function metricPoints(kind){
  var pts = [];
  data.entries.forEach(function(e){
    if(kind==='dist') pts.push({ d:e.d, v:e.m });
    else if(e.t) pts.push({ d:e.d, v: kind==='time' ? e.t : e.t/e.m });
  });
  pts.sort(function(a,b){ return a.d-b.d; });
  return pts.slice(-30);
}
/* round the y-axis to sensible bounds + ticks instead of raw data min/max.
   dist snaps to decimal miles; pace/time (seconds) snap to time-friendly steps. */
function niceAxis(min, max, kind){
  var steps = kind==='dist'
    ? [0.1,0.2,0.5,1,2,5,10,20,50]
    : [15,30,60,120,300,600,900,1800,3600];
  var flat = (max-min) <= 0;
  var span = flat ? (kind==='dist' ? 0.5 : 60) : (max-min);
  var step = steps[steps.length-1];
  for(var i=0;i<steps.length;i++){ if(span/steps[i] <= 3.0001){ step=steps[i]; break; } }
  var lo, hi;
  if(flat){ var c=Math.round(min/step)*step; lo=c-step; hi=c+step; }
  else {
    lo = Math.floor(min/step + 1e-9)*step;
    hi = Math.ceil(max/step - 1e-9)*step;
    if(hi-lo < step*0.5) hi = lo + step;
  }
  var n = Math.round((hi-lo)/step), ticks=[];
  for(var k=0;k<=n;k++) ticks.push(lo + k*step);
  return { lo:lo, hi:hi, step:step, ticks:ticks };
}
function renderChart(){
  var wrap = $('chartWrap');
  if(data.entries.length < 2){ wrap.hidden = true; return; }
  wrap.hidden = false;
  var kind = data.metric;
  $('metricBtn').textContent = METRIC_LABEL[kind];
  var W=340, H=150, ml=46, mr=10, mt=12, mb=22, out='';
  var pts = metricPoints(kind);
  if(!pts.length){
    $('chart').innerHTML = '<text class="cEmpty" x="'+(W/2)+'" y="'+(H/2)+'" text-anchor="middle">No times logged yet \u2014 add one to a run</text>';
    return;
  }
  var minV=Infinity, maxV=-Infinity, minD=Infinity, maxD=-Infinity;
  pts.forEach(function(p){
    if(p.v<minV) minV=p.v; if(p.v>maxV) maxV=p.v;
    if(p.d<minD) minD=p.d; if(p.d>maxD) maxD=p.d;
  });
  var ax = niceAxis(minV, maxV, kind), lo=ax.lo, hi=ax.hi;
  var dec = (kind==='dist') ? (ax.step < 1 ? 1 : 0) : 0;
  if(minD===maxD){ minD-=43200000; maxD+=43200000; }
  var inv = (kind==='pace');
  function X(dd){ return ml + (dd-minD)/(maxD-minD)*(W-ml-mr); }
  function Y(v){ var f=(v-lo)/(hi-lo); if(!inv) f=1-f; return mt + f*(H-mt-mb); }
  function lbl(v){ return kind==='dist' ? v.toFixed(dec) : fmtTime(Math.max(1, Math.round(v))); }
  var ticks = ax.ticks;
  ticks.forEach(function(t){
    var y = Y(t).toFixed(1);
    out += '<line class="cGrid" x1="'+ml+'" y1="'+y+'" x2="'+(W-mr)+'" y2="'+y+'"/>';
    out += '<text class="cLbl" x="'+(ml-6)+'" y="'+(+y+3.5)+'" text-anchor="end">'+lbl(t)+'</text>';
  });
  out += '<text class="cLbl" x="'+ml+'" y="'+(H-6)+'" text-anchor="start">'+fmtDay.format(new Date(minD===maxD?pts[0].d:minD))+'</text>';
  if(maxD-minD > 43200001)
    out += '<text class="cLbl" x="'+(W-mr)+'" y="'+(H-6)+'" text-anchor="end">'+fmtDay.format(new Date(maxD))+'</text>';
  if(pts.length>1){
    var dd='';
    pts.forEach(function(p,i){ dd += (i?' L ':'M ')+X(p.d).toFixed(1)+' '+Y(p.v).toFixed(1); });
    out += '<path class="cLine" d="'+dd+'"/>';
  }
  pts.forEach(function(p){
    out += '<circle class="cDot" cx="'+X(p.d).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3.5"/>';
  });
  $('chart').innerHTML = out;
}

/* ---------- run-log sort (session-only; resets to date order on load) ---------- */
var LOG_SORTS = ['date','dist','time','pace'];
var LOG_LABEL = { date:'Newest', dist:'Longest', time:'Longest time', pace:'Fastest' };
var logSort = 'date';
function logComparator(kind){
  return function(a,b){
    if(kind==='dist') return (b.m-a.m) || (b.d-a.d);
    if(kind==='time'){ if(!a.t&&!b.t) return b.d-a.d; if(!a.t) return 1; if(!b.t) return -1; return (b.t-a.t) || (b.d-a.d); }
    if(kind==='pace'){ if(!a.t&&!b.t) return b.d-a.d; if(!a.t) return 1; if(!b.t) return -1; return (a.t/a.m - b.t/b.m) || (b.d-a.d); }
    return b.d-a.d; /* date, newest first */
  };
}

var fillTarget = 0;
function render(splash){
  var t = total(), p = t/data.target;
  $('pct').textContent = Math.round(p*100);
  $('done').textContent = t.toFixed(1);
  $('tgt').textContent = data.target;
  $('left').textContent = Math.max(0, data.target-t).toFixed(1);
  var wkStart = new Date(); wkStart.setHours(0,0,0,0);
  wkStart.setDate(wkStart.getDate() - ((wkStart.getDay()+6)%7));
  var wk = data.entries.filter(function(e){ return e.d >= wkStart.getTime(); }).length;
  var mx = data.entries.reduce(function(a,e){ return Math.max(a,e.m); }, 0);
  $('stats2').hidden = !data.entries.length;
  $('wkRuns').textContent = wk;
  $('wkWord').textContent = wk===1 ? 'run' : 'runs';
  $('prMi').textContent = mx.toFixed(1);
  $('status').textContent = statusLabel(p);
  var c = liqColors(Math.min(1.2,p));
  $('dot').style.background = c[1];
  document.getElementById('sTop').setAttribute('stop-color', c[0]);
  document.getElementById('sBot').setAttribute('stop-color', c[1]);
  fillTarget = Math.max(0, Math.min(1, p));
  if(splash) S.amp = Math.min(15, S.amp+6);

  var log = $('log'); log.innerHTML = '';
  var list = data.entries.slice().sort(logComparator(logSort));
  $('empty').hidden = list.length>0;
  $('sortBtn').hidden = list.length < 2;
  $('sortBtn').textContent = LOG_LABEL[logSort];
  list.forEach(function(e){
    var li = document.createElement('li');
    var pace = e.t ? '<span class="p">'+fmtTime(Math.round(e.t/e.m))+' /mi</span>' : '';
    li.innerHTML = '<button class="d" data-date="'+e.id+'" aria-label="Edit date">'+fmtDate.format(new Date(e.d))+'</button>'+
                   '<button class="t" data-time="'+e.id+'" aria-label="Edit time to complete"><span class="tv">'+(e.t?fmtTime(e.t):'\u2013:\u2013')+'</span>'+pace+'</button>'+
                   '<span class="m">'+e.m.toFixed(1)+' mi</span>'+
                   '<button class="del" data-del="'+e.id+'" aria-label="Delete entry">&times;</button>';
    log.appendChild(li);
  });
  renderChart();
}

  requestAnimationFrame(function(){ t.classList.add('show'); });

}

/* ---------- actions ---------- */
function addMiles(m, tSec){
  m = Math.round(m*10)/10;
  if(!(m>0) || m>500) return;
  var pre = total(),
      wasEmpty = data.entries.length === 0,
      prevMax = data.entries.reduce(function(a,e){ return Math.max(a,e.m); }, 0),
      had5k = data.entries.some(function(e){ return e.m >= 3.1; });
  var entry = { id: Date.now()+Math.random().toString(16).slice(2), m:m, d:Date.now() };
  if(tSec) entry.t = tSec;
  data.entries.push(entry);
  save(); render(true);
  var post = pre + m, msg = null, i;
  for(i = MARKS.length-1; i >= 0; i--)
    if(pre < MARKS[i][0] && post >= MARKS[i][0]){ msg = MARKS[i][1]; break; }
  if(wasEmpty) msg = 'Run one logged \u2014 welcome to the club';
  else if(m >= 3.1 && !had5k) msg = 'A full 5K in one go \u2014 that\u2019s the whole point of C25K';
  else if(!msg && m > prevMax) msg = 'New longest run \u2014 '+m.toFixed(1)+' mi';
  if(msg){ toast(msg); S.amp = 15; }
}
$('addBtn').addEventListener('click', function(){
  var v = parseFloat($('miles').value);

  if(tv){
    ts = parseTime(tv);
    if(!ts){ $('mins').classList.add('bad'); $('mins').focus(); return; }
  }
  if(v>0){
    addMiles(v, ts);
    $('miles').value=''; $('mins').value=''; $('mins').classList.remove('bad');
    $('miles').blur(); $('mins').blur();
  }
});

$('log').addEventListener('click', function(e){
  var b = e.target.closest('button[data-del]');
  if(b){
    data.entries = data.entries.filter(function(x){ return x.id!==b.dataset.del; });
    save(); render(true); return;
  }
  var db = e.target.closest('button[data-date]');
  if(db){
    var en = byId(db.dataset.date); if(!en) return;
    var cur = new Date(en.d);
    var iso = cur.getFullYear()+'-'+p2(cur.getMonth()+1)+'-'+p2(cur.getDate());
    var today = new Date();
    ask({ title:'Run date', input:true, type:'date', value:iso,
          max: today.getFullYear()+'-'+p2(today.getMonth()+1)+'-'+p2(today.getDate()),
          onOk:function(v){
            var mch = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v); if(!mch) return;
            var nd = new Date(+mch[1], +mch[2]-1, +mch[3], cur.getHours(), cur.getMinutes());
            if(isNaN(nd.getTime())) return;
            var eod = new Date(); eod.setHours(23,59,59,999);
            if(nd.getTime() > eod.getTime()) return;
            en.d = nd.getTime(); save(); render(false);
          } });
    return;
  }
  var tb = e.target.closest('button[data-time]');
  if(tb){
    var en2 = byId(tb.dataset.time); if(!en2) return;
    ask({ title:'Time to complete', text:'Colon, dot or space all work \u2014 25.58 means 25:58. Empty clears it.',
          input:true, type:'text', inputmode:'decimal', placeholder:'mm:ss',
          value: en2.t ? fmtTime(en2.t) : '',
          onOk:function(v){
            v = (''+v).trim();
            if(!v){ delete en2.t; save(); render(false); return; }
            var sec = parseTime(v);
            if(sec){ en2.t = sec; save(); render(false); }
          } });
  }
});

/* ---------- physics ---------- */
var reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
var S = { fill:{x:0,v:0}, liq:{x:0,v:0}, shoe:{x:0,v:0}, amp:0, phase:0, tiltSm:0, lastTilt:0, bob:0 };
var tiltDeg=0, simTilt=0, sensorOn=false, dragging=false, dragX0=0, dragBase=0;
var bubbles=[];

function spring(s, target, w, z, dt){
  s.v += ( w*w*(target - s.x) - 2*z*w*s.v ) * dt;
  s.x += s.v * dt;
}

window.addEventListener('deviceorientation', function(e){
  if(e.gamma==null && e.beta==null) return;
  var ang = (screen.orientation && screen.orientation.angle);
  if(ang==null) ang = window.orientation||0;
  var t;
  if(ang===90) t = e.beta; else if(ang===-90||ang===270) t = -e.beta;
  else if(ang===180) t = -e.gamma; else t = e.gamma;
  tiltDeg = Math.max(-60, Math.min(60, t||0));
  if(!sensorOn){ sensorOn=true; $('hint').textContent='tilt your phone'; }
});
window.addEventListener('devicemotion', function(e){
  var a = e.acceleration;
  if(a && a.x!=null) S.amp = Math.min(15, S.amp + Math.min(3, Math.abs(a.x)*0.06));
});

/* iOS 13+ motion permission */

               typeof DeviceOrientationEvent.requestPermission==='function';
if(needPerm){

}

/* pointer fallback: drag to tilt, tap to splash */
var stage = $('stage');
stage.addEventListener('pointerdown', function(e){
  dragging=true; dragX0=e.clientX; dragBase=simTilt;
  S.amp=Math.min(15,S.amp+4);
  if(stage.setPointerCapture) try{ stage.setPointerCapture(e.pointerId); }catch(_){}
});
stage.addEventListener('pointermove', function(e){
  if(!dragging) return;
  simTilt = Math.max(-45, Math.min(45, dragBase + (e.clientX-dragX0)/3.2));
});
function endDrag(){ dragging=false; }
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
if(!('ontouchstart' in window)) $('hint').textContent='drag the shoe';

/* geometry */
var TOPY=76, BOTY=546, CX=190, PIVY=250, L=20, R=360, FLOOR=640, N=22;
var VCOLS=[[88,128,351],[96,84,457],[104,80,510],[112,77,530],[120,75,540],[128,73,546],[136,73,547],[144,73,545],[152,74,537],[160,76,525],[168,78,506],[176,81,482],[184,83,452],[192,86,425],[200,89,402],[208,93,383],[216,96,365],[224,101,350],[232,106,335],[240,111,320],[248,118,306],[256,128,291],[264,222,276],[272,230,267],[280,246,254]], COLW=8;
var shoeG=$('shoeG'), liquidPath=$('liquidPath'), meniscus=$('meniscus'),
    liquidG=$('liquidG'), bubblesG=$('bubbles'), shadow=$('shadow');

/* volume-conserving surface: VCOLS = [x, yTop, yBottom] strips of the shoe interior */
var TOTAL = 0;
(function(){ for(var i=0;i<VCOLS.length;i++) TOTAL += VCOLS[i][2]-VCOLS[i][1]; TOTAL *= COLW; })();
function wetArea(c, sl){
  var a = 0, i, col, cy, h;
  for(i=0;i<VCOLS.length;i++){
    col = VCOLS[i];
    cy = c + sl*(col[0]-CX);
    h = col[2] - Math.max(col[1], cy);
    if(h>0) a += h;
  }
  return a*COLW;
}
function solveCut(frac, sl){
  var target = frac*TOTAL, lo = -200, hi = 800, mid, i;
  for(i=0;i<20;i++){
    mid = (lo+hi)/2;
    if(wetArea(mid, sl) > target) lo = mid; else hi = mid;
  }
  return (lo+hi)/2;
}

var last = performance.now(), bobT = 0;
function frame(now){
  var dt = Math.min(0.05, (now-last)/1000) || 0.016; last = now;

  var target = dragging ? simTilt : (sensorOn ? tiltDeg : simTilt);
  if(!dragging && !sensorOn) simTilt += (0-simTilt)*Math.min(1,dt*4);
  if(reduceMotion) target = 0;
  S.tiltSm += (target - S.tiltSm) * Math.min(1, dt*12);
  var tv = (S.tiltSm - S.lastTilt)/dt; S.lastTilt = S.tiltSm;

  /* shoe: gimbal that speedily self-rights */
  S.shoe.v += -tv * dt * 1.15;
  spring(S.shoe, 0, 9, 0.45, dt);
  S.shoe.x = Math.max(-16, Math.min(16, S.shoe.x));

  /* liquid: level in world = counter device tilt and shoe rotation */
  var liqTarget = Math.max(-0.5, Math.min(0.5, (-(S.tiltSm) - S.shoe.x) * 0.0155));
  spring(S.liq, liqTarget, 6.5, 0.3, dt);

  /* wave energy */
  if(!reduceMotion){
    S.amp = Math.min(15, S.amp + Math.abs(tv)*dt*0.10 + Math.abs(S.liq.v)*dt*9);
    S.amp *= Math.exp(-dt*2.1);
    S.phase += dt*(5 + S.amp*0.6);
  } else { S.amp = 0; }

  /* displayed fill eases to target */
  if(reduceMotion){ S.fill.x = fillTarget; S.fill.v = 0; }
  else spring(S.fill, fillTarget, 3.6, 0.95, dt);
  S.fill.x = Math.max(0, Math.min(1.02, S.fill.x));

  /* float bob */
  bobT += dt; S.bob = reduceMotion ? 0 : 10*Math.sin(bobT*1.15);

  shoeG.setAttribute('transform',
    'translate(0 '+S.bob.toFixed(2)+') rotate('+S.shoe.x.toFixed(2)+' '+CX+' '+PIVY+')');
  shadow.setAttribute('rx', (88 - S.bob*1.3).toFixed(1));
  shadow.setAttribute('opacity', (0.18 - S.bob*0.006).toFixed(3));

  /* liquid surface: solve for the line that keeps wet area = fill fraction at this angle */
  if(S.fill.x <= 0.004){ liquidG.setAttribute('display','none'); }
  else{
    liquidG.removeAttribute('display');
    var tan = Math.tan(S.liq.x);
    var cut = solveCut(Math.min(1, S.fill.x), tan);
    var effAmp = S.amp * Math.max(0, Math.min(1, S.fill.x*12, (1.05-S.fill.x)*10));
    var d='M '+L+' '+FLOOR, m='';
    for(var i=0;i<=N;i++){
      var x = L + (R-L)*i/N;
      var y = cut + tan*(x-CX)
            + effAmp*Math.sin(x/45 + S.phase)
            + effAmp*0.35*Math.sin(x/21 - S.phase*1.7);
      d += ' L '+x.toFixed(1)+' '+y.toFixed(1);
      m += (i? ' L ':'M ')+x.toFixed(1)+' '+y.toFixed(1);
    }
    d += ' L '+R+' '+FLOOR+' Z';
    liquidPath.setAttribute('d', d);
    meniscus.setAttribute('d', m);
    meniscus.setAttribute('opacity', Math.min(0.6, 0.22 + S.amp*0.04).toFixed(2));

    /* bubbles */
    if(!reduceMotion && S.fill.x>0.06 && bubbles.length<9 && Math.random()<dt*2.4)
      bubbles.push({ x:105+Math.random()*175, y:BOTY-8, r:1.4+Math.random()*2.4,
                     v:16+Math.random()*26, ph:Math.random()*9 });
    var bs='';
    bubbles = bubbles.filter(function(b){
      b.y -= b.v*dt; b.x += Math.sin(b.y/13+b.ph)*9*dt;
      if(b.y < cut + tan*(b.x-CX) + 7) return false;
      bs += '<circle cx="'+b.x.toFixed(1)+'" cy="'+b.y.toFixed(1)+'" r="'+b.r+'" fill="#fff" opacity="0.3"/>';
      return true;
    });
    bubblesG.innerHTML = bs;
  }
  requestAnimationFrame(frame);
}

/* ---------- weekly recap ---------- */
function weekStats(sinceMs){
  var runs = data.entries.filter(function(e){ return e.d >= sinceMs; });
  var miles = runs.reduce(function(a,e){ return a+e.m; }, 0);
  var longest = runs.reduce(function(a,e){ return Math.max(a,e.m); }, 0);
  return { n:runs.length, miles:miles, longest:longest };
}
function recapCopy(s){
  if(s.n===0) return 'Quiet week on the shoe \u2014 no pressure, it\u2019ll be there when you\u2019re ready.';
  if(s.n===1) return 'One run this week \u2014 '+s.miles.toFixed(1)+' mi in the bank. Every mile counts.';
  var lines = [
    'Solid week: '+s.n+' runs, '+s.miles.toFixed(1)+' mi total. Longest was '+s.longest.toFixed(1)+' mi.',
    s.n+' runs this week for '+s.miles.toFixed(1)+' mi \u2014 that\u2019s real momentum.',
    'You logged '+s.n+' runs and '+s.miles.toFixed(1)+' mi this week. Keep it rolling.'
  ];
  return lines[Math.floor(Math.random()*lines.length)];
}
function recapConfigured(){ return !!(data.ejKey && data.ejService && data.ejTemplate); }
function sendRecap(onDone){
  var now = Date.now(), since = data.recapLast || (now - 7*86400000);
  var s = weekStats(since);
  fetch('https://api.emailjs.com/api/v1.0/email/send', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ service_id:data.ejService, template_id:data.ejTemplate, user_id:data.ejKey,
                            template_params:{ message:recapCopy(s), run_count:s.n, miles:s.miles.toFixed(1) } })
  }).then(function(r){
    if(!r.ok) throw new Error('send failed');
    data.recapLast = now; save();
    if(onDone) onDone(true);
  }).catch(function(){ if(onDone) onDone(false); });
}
function maybeSendRecap(){
  if(!recapConfigured()) return;
  if(data.recapLast && Date.now()-data.recapLast < 7*86400000) return;
  sendRecap(function(ok){ if(ok) toast('Weekly recap emailed'); });
}

render(false);
if(data.entries.length){
  var lastD = data.entries.reduce(function(a,e){ return Math.max(a,e.d); }, 0);
  var gap = Math.floor((Date.now()-lastD)/86400000);
  if(gap >= 5) setTimeout(function(){ toast('Been '+gap+' days \u2014 the trainers are ready when you are'); }, 900);
}
try{ setTimeout(maybeSendRecap, 1500); }catch(e){}
requestAnimationFrame(frame);

/* ---------- PWA ---------- */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
}
})();
</script>
